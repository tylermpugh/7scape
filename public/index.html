<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>7scape</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:monospace;max-width:800px;margin:40px auto;padding:0 16px}
    input,button,textarea{font-family:inherit;font-size:14px}
    textarea{width:100%;height:100px}
    .row{margin-bottom:12px}
    .post{border-top:1px solid #ddd;padding:12px 0}
    .meta{color:#666;font-size:12px;margin-bottom:6px}
    .tabs a{margin-right:12px}
    .card{border:1px solid #ddd;padding:12px;border-radius:8px;margin-bottom:16px}
    .small{font-size:12px;color:#666}
  </style>
</head>
<body>
  <h1>7scape</h1>

  <!-- signup -->
  <div class="card">
    <h3>create account</h3>
    <div class="row"><input id="suUsername" maxlength="18" placeholder="username (max 18 chars)" /></div>
    <div class="row"><input id="suEmail" placeholder="email" /></div>
    <div class="row">
      <button id="signupBtn">sign up</button>
      <span id="signupMsg" class="small"></span>
    </div>
    <div class="small">if the username/email already exists, we’ll just sign you in and return your id.</div>
  </div>

  <!-- composer -->
  <div class="card">
    <h3>post</h3>
    <div class="row">
      <input id="userId" placeholder="user_id" />
      <span class="small" id="userHint"></span>
    </div>
    <div class="row">
      <textarea id="content" maxlength="500" placeholder="say something (500 chars max). text-only — no links."></textarea>
    </div>
    <div class="row">
      <button id="send">post</button>
      <span id="msg" class="small"></span>
    </div>
  </div>

  <!-- feeds -->
  <div class="tabs">
    <a href="#" id="tabGlobal">global</a>
    <a href="#" id="tabHome">home</a>
  </div>

  <div id="feed"></div>

  <script>
    const feed = document.getElementById('feed');
    const msg = document.getElementById('msg');
    const signupMsg = document.getElementById('signupMsg');
    const userIdInput = document.getElementById('userId');
    const userHint = document.getElementById('userHint');

    function setUserId(id){
      localStorage.setItem('user_id', String(id));
      userIdInput.value = String(id);
      userHint.textContent = `(saved)`;
    }
    (function initUser(){
      const saved = localStorage.getItem('user_id');
      if(saved){ userIdInput.value = saved; userHint.textContent = `(saved)`; }
    })();

    document.getElementById('signupBtn').onclick = async () => {
      signupMsg.textContent = '';
      const username = document.getElementById('suUsername').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      if(!username || !email){ signupMsg.textContent = 'need username and email'; return; }
      try{
        const res = await fetch('/signup', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username, email })
        });
        const j = await res.json();
        if(j.error){ signupMsg.textContent = j.error; return; }
        setUserId(j.id);
        signupMsg.textContent = `ok — your user_id is ${j.id}`;
      }catch(e){
        signupMsg.textContent = 'signup failed';
      }
    };

    document.getElementById('send').onclick = async () => {
      const user_id = userIdInput.value.trim();
      const content = document.getElementById('content').value.trim();
      if(!user_id || !content){ msg.textContent='need user_id and content'; return; }
      try{
        const res = await fetch('/post',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({user_id, content})
        });
        const j = await res.json();
        msg.textContent = j.error ? j.error : 'posted';
        if(!j.error){ document.getElementById('content').value=''; loadGlobal(); }
      }catch(e){
        msg.textContent = 'post failed';
      }
    };

    function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    async function loadGlobal(){ const r = await fetch('/feed/global'); render(await r.json()); }
    async function loadHome(){
      const uid = userIdInput.value.trim();
      if(!uid){ msg.textContent='enter your user_id to view home'; return; }
      const r = await fetch('/feed/home/'+uid); render(await r.json());
    }
    function render(rows){
      feed.innerHTML = rows.map(r=>`
        <div class="post">
          <div class="meta">@${r.username} — ${new Date(r.created_at).toLocaleString()}</div>
          <div>${escapeHtml(r.content)}</div>
        </div>
      `).join('') || '<p>(no posts yet)</p>';
    }
    document.getElementById('tabGlobal').onclick = (e)=>{e.preventDefault(); loadGlobal();}
    document.getElementById('tabHome').onclick = (e)=>{e.preventDefault(); loadHome();}
    loadGlobal();
  </script>
</body>
</html>
